# Theme derived with the ui-ux-pro-max design intelligence skill.
# Product type: SaaS / enterprise dashboard -> Minimalism & Swiss Style.
# Palette: SaaS (General) trust blue #2563EB on a neutral slate surface.
# Configured declaratively so no custom CSS or JavaScript is injected and the
# app stays deployable on Streamlit Community Cloud.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"

# Streamlit Community Cloud demo runtime settings (Phase 9).
[server]
# The demo has no upload-heavy workflow on Cloud; the ingestion page caps
# uploads separately. Keeping this modest protects the shared container.
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
# No usage statistics are sent from the demo deployment.
gatherUsageStats = false

[client]
# Tracebacks stay in the server log; the app shows a friendly message instead.
showErrorDetails = "none"
toolbarMode = "minimal"

[runner]
magicEnabled = false
